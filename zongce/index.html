<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>综合测评材料申报</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
}
.container {
  background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  width: 100%; max-width: 760px; padding: 36px 40px; animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
h1 { text-align: center; color: #333; margin-bottom: 8px; font-size: 28px; }
h2 { color: #555; font-size: 18px; margin: 24px 0 10px; padding-bottom: 6px; border-bottom: 2px solid #eee; }
h3 { color: #555; font-size: 15px; margin: 18px 0 8px; }
.subtitle { text-align: center; color: #888; margin-bottom: 28px; font-size: 14px; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #444; font-size: 14px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0;
  border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.2s; background: #fff;
  font-family: inherit;
}
.form-group textarea { resize: vertical; min-height: 110px; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #667eea; }
.form-group input[type="file"] { padding: 10px; font-size: 14px; }
.btn {
  width: 100%; padding: 14px; border: none; border-radius: 8px;
  font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.btn-primary {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; margin-top: 8px;
}
.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-secondary { background: #f0f0f0; color: #555; margin-top: 10px; }
.btn-secondary:hover { background: #e4e4e4; }
.btn-small { width: auto; padding: 6px 16px; font-size: 13px; margin-top: 4px; display: inline-block; }
.btn-del { background: #fdecea; color: #c0392b; }
.btn-del:hover { background: #fadbd8; }
.error-msg { color: #e74c3c; text-align: center; margin-top: 12px; font-size: 14px; min-height: 20px; }
.current-user {
  background: #f8f4ff; border-left: 4px solid #667eea;
  padding: 12px 16px; border-radius: 0 8px 8px 0; margin-bottom: 20px; font-size: 15px; color: #555;
}

/* Draft image thumbnails */
.thumb { position: relative; display: inline-block; margin: 0 10px 10px 0; }
.thumb img { width: 92px; height: 92px; object-fit: cover; border-radius: 8px; border: 1px solid #e0e0e0; }
.thumb .x {
  position: absolute; top: -7px; right: -7px; background: #e74c3c; color: #fff;
  border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 13px;
  line-height: 22px; text-align: center; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.25);
}
.img-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }

/* History records */
.entry-item { background: #fafafa; border: 1px solid #eee; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.entry-text { color: #444; font-size: 14px; white-space: pre-wrap; word-break: break-all; line-height: 1.6; }
.entry-img { width: 90px; height: 90px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 1px solid #eee; }
.q-box {
  background: #fff8e1; border-left: 3px solid #f0b429; border-radius: 0 6px 6px 0;
  padding: 8px 12px; margin-top: 10px; font-size: 13px; color: #8a6d1a; line-height: 1.6;
  white-space: pre-wrap; word-break: break-all;
}
.q-box b { color: #7c5f0a; }
.entry-actions { margin-top: 10px; display: flex; justify-content: flex-end; }
.entry-meta { font-size: 12px; color: #aaa; margin-top: 10px; }
.no-score { color: #ccc; font-style: italic; }
.loading { text-align: center; color: #999; padding: 40px; font-size: 15px; }

/* Admin progress */
.progress-bar-wrap { background: #eee; border-radius: 8px; height: 18px; margin-bottom: 6px; overflow: hidden; }
.progress-bar-fill { height: 100%; border-radius: 8px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); transition: width 0.5s ease; }
.progress-sub { font-size: 13px; color: #888; text-align: center; margin-bottom: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.tag { display: inline-block; padding: 3px 9px; border-radius: 16px; font-size: 12px; font-weight: 500; }
.tag-done { background: #e8f5e9; color: #2e7d32; }
.tag-pending { background: #fff3e0; color: #e65100; }

.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }

.lightbox {
  position: fixed; inset: 0; background: rgba(0,0,0,0.88);
  display: none; align-items: center; justify-content: center; z-index: 999; cursor: zoom-out;
}
.lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 8px; }

#toast {
  position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
  background: #2e7d32; color: #fff; padding: 10px 22px; border-radius: 24px;
  font-size: 14px; display: none; z-index: 1001; box-shadow: 0 6px 20px rgba(0,0,0,0.2); transition: opacity 0.3s;
}
</style>
</head>
<body>

<div class="container" id="container">

  <!-- View 1: Login -->
  <div id="view-login">
    <h1>📋 综合测评材料申报</h1>
    <p class="subtitle">信息学部 2025-2026 学年 · 海技一班</p>
    <div class="form-group">
      <label for="login-name">姓名</label>
      <input type="text" id="login-name" list="name-list" placeholder="请输入姓名" autocomplete="off">
      <datalist id="name-list"></datalist>
    </div>
    <div class="form-group">
      <label for="login-id">学号</label>
      <input type="text" id="login-id" placeholder="请输入学号" autocomplete="off" inputmode="numeric">
    </div>
    <button class="btn btn-primary" onclick="handleLogin()">确 认</button>
    <p class="error-msg" id="login-error"></p>
  </div>

  <!-- View 2: Submission -->
  <div id="view-submit" style="display:none;">
    <h1>📝 综合测评材料申报</h1>
    <div class="current-user" id="current-user-info"></div>

    <div class="form-group">
      <label>📄 文字区</label>
      <textarea id="submit-text" placeholder="请填写申报说明 / 材料文字…"></textarea>
    </div>

    <div class="form-group">
      <label>🖼️ 图片区（可多张）</label>
      <input type="file" id="submit-file" accept="image/*" multiple>
      <div class="img-grid" id="submit-images"></div>
    </div>

    <div class="form-group">
      <label>❓ 疑问点</label>
      <textarea id="submit-question" placeholder="如有不确定 / 有疑问的地方，请写在这里（管理员会查看）"></textarea>
    </div>

    <button class="btn btn-primary" id="btn-submit" onclick="handleSubmit()">提 交</button>
    <p class="error-msg" id="submit-error"></p>

    <h2>📄 我的历史提交</h2>
    <div id="submit-history"><div class="loading">加载中…</div></div>

    <button class="btn btn-secondary" onclick="goToLogin()">返回登录</button>
  </div>

  <!-- View 3: Admin overview -->
  <div id="view-admin1" style="display:none;">
    <h1>🔧 申报总览</h1>
    <p class="subtitle">全班申报进度</p>
    <div id="admin1-content"><div class="loading">加载中…</div></div>
    <button class="btn btn-secondary" onclick="showView('view-admin2');renderAdmin2();">查看个人明细 →</button>
    <button class="btn btn-secondary" onclick="goToLogin()">返回登录</button>
  </div>

  <!-- View 4: Admin detail -->
  <div id="view-admin2" style="display:none;">
    <h1>🔧 个人明细</h1>
    <p class="subtitle">选择学生查看其申报材料</p>
    <div class="form-group">
      <select id="admin2-select" onchange="renderStudentDetail(this.value)">
        <option value="">请选择学生</option>
      </select>
    </div>
    <div id="admin2-detail"></div>
    <button class="btn btn-secondary" onclick="showView('view-admin1');renderAdmin1();">← 返回总览</button>
    <button class="btn btn-secondary" onclick="goToLogin()">返回登录</button>
  </div>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()"><img id="lightbox-img" alt=""></div>

<div id="toast"></div>

<script>
// ===== SUPABASE =====
const SUPABASE_URL = 'https://tcqwzumktgjyclnmotgb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjcXd6dW1rdGdqeWNsbm1vdGdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNDg1ODYsImV4cCI6MjEwMTkyNDU4Nn0.G0JcfU_W70q5HHUkYBzyKGH6i7tOFeEIYz9StZN1VoQ';

async function supabaseGet(path) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
  });
  if (!res.ok) throw new Error((await res.json()).message || res.statusText);
  return res.json();
}
async function supabaseInsert(table, row) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + table, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json', 'Prefer': 'return=minimal'
    },
    body: JSON.stringify(row)
  });
  if (!res.ok) throw new Error((await res.json()).message || res.statusText);
}
async function supabaseDelete(table, id) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + table + '?id=eq.' + id, {
    method: 'DELETE',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
  });
  if (!res.ok) throw new Error((await res.json()).message || res.statusText);
}

// ===== DATA =====
const ROSTER = [
  ['蔡丽华','25020041001'], ['曹哲','25020041002'], ['陈超祺','25020041004'], ['陈可可','25020041005'],
  ['陈瑞','25020041007'], ['陈晓曦','25020041008'], ['陈昀都','25020041010'], ['陈哲鸣','25020041011'],
  ['程胜杰','25020041012'], ['崔于悦','25020041013'], ['单歆博','25020041014'], ['丁铎航','25020041015'],
  ['丁世杰','25020041016'], ['段熙然','25020041017'], ['段泽昊','25020041018'], ['樊于悦','25020041019'],
  ['高邓鑫','25020041021'], ['高颢瑜','25020041022'], ['高子昂','25020041024'], ['龚垚兴','25020041025'],
  ['官晓悠','25020041026'], ['海洋','25020041027'], ['韩雨辰','25020041028'], ['郝佳绮','25020041029'],
  ['何嘉怡','25020041031'], ['何宗泉','25020041032'], ['胡鑫慧','25020041033'], ['焦子健','25020041036'],
  ['赖芳群','25020041037'], ['兰萍瑞','25020041038'], ['李宛佳泓','25020041041'], ['李想','25020041042'],
  ['李馨悦','25020041043'], ['李雨航','25020041044'], ['练一凡','25020041045'], ['林依然','25020041049'],
  ['楼庆同','25020041060'], ['张永俊','24020041111']
];
const NAME_TO_ID = Object.fromEntries(ROSTER);
const ALL_NAMES = ROSTER.map(r => r[0]);

const ADMIN_NAME = '张思浩';
const ADMIN_ID = '000000';

let currentUser = null;   // { name, id, mode: 'student'|'admin' }
let myEntries = [];       // current student's submissions
let allRows = [];         // admin cache
let draftImages = [];     // data URLs awaiting submit

// Init datalist + file input
(function(){
  const dl = document.getElementById('name-list');
  ALL_NAMES.forEach(n => { const o = document.createElement('option'); o.value = n; dl.appendChild(o); });
  document.getElementById('submit-file').addEventListener('change', onFilesChange);
})();

// ===== HELPERS =====
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showView(v) {
  ['view-login','view-submit','view-admin1','view-admin2'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
  document.getElementById(v).style.display = 'block';
  document.getElementById('container').style.animation = 'none';
  document.getElementById('container').offsetHeight;
  document.getElementById('container').style.animation = 'fadeIn 0.3s ease';
}
function goToLogin() {
  currentUser = null;
  document.getElementById('login-name').value = '';
  document.getElementById('login-id').value = '';
  document.getElementById('login-error').textContent = '';
  showView('view-login');
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block'; t.style.opacity = '1';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.style.display = 'none', 300); }, 2200);
}
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').style.display = 'flex';
}
function closeLightbox() { document.getElementById('lightbox').style.display = 'none'; }

function compressImage(file, maxDim = 1200, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Parse image_data (JSON array, with fallback to single string)
function parseImages(data) {
  if (!data) return [];
  if (Array.isArray(data)) return data;
  try { const a = JSON.parse(data); return Array.isArray(a) ? a : [data]; }
  catch(e) { return [data]; }
}

// ===== VIEW 1: LOGIN =====
function handleLogin() {
  const name = document.getElementById('login-name').value.trim();
  const id = document.getElementById('login-id').value.trim();
  const err = document.getElementById('login-error');
  if (!name) { err.textContent = '请输入姓名'; return; }
  if (!id) { err.textContent = '请输入学号'; return; }

  if (name === ADMIN_NAME && id === ADMIN_ID) {
    err.textContent = ''; showView('view-admin1'); renderAdmin1(); return;
  }
  if (NAME_TO_ID[name] !== undefined) {
    if (NAME_TO_ID[name] !== id) { err.textContent = '学号与姓名不匹配'; return; }
    currentUser = { name, id, mode: 'student' };
    err.textContent = ''; goToSubmit(); return;
  }
  err.textContent = '姓名不在名单中';
}

// ===== VIEW 2: SUBMISSION =====
async function loadMyEntries() {
  myEntries = await supabaseGet('submissions?student_id=eq.' + currentUser.id + '&select=*&order=id.desc');
}
async function goToSubmit() {
  showView('view-submit');
  document.getElementById('current-user-info').textContent =
    '当前申报人：' + currentUser.name + '（' + currentUser.id + '）';
  resetDraft();
  document.getElementById('submit-history').innerHTML = '<div class="loading">加载中…</div>';
  try { await loadMyEntries(); renderHistory(); }
  catch(e) { document.getElementById('submit-history').innerHTML = '<div class="loading">加载失败: ' + esc(e.message) + '</div>'; }
}

function resetDraft() {
  draftImages = [];
  document.getElementById('submit-text').value = '';
  document.getElementById('submit-question').value = '';
  document.getElementById('submit-file').value = '';
  document.getElementById('submit-error').textContent = '';
  renderDraftImages();
}

function renderDraftImages() {
  const el = document.getElementById('submit-images');
  if (!draftImages.length) { el.innerHTML = ''; return; }
  el.innerHTML = draftImages.map((src, i) =>
    '<div class="thumb"><img src="' + src + '"><button class="x" onclick="removeDraftImage(' + i + ')">×</button></div>'
  ).join('');
}
function removeDraftImage(i) { draftImages.splice(i, 1); renderDraftImages(); }

async function onFilesChange(e) {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  const err = document.getElementById('submit-error');
  err.textContent = '';
  for (const f of files) {
    try { draftImages.push(await compressImage(f)); }
    catch(x) { err.textContent = '某张图片处理失败，请换一张试试'; }
  }
  e.target.value = ''; // allow re-selecting the same file
  renderDraftImages();
}

async function handleSubmit() {
  const err = document.getElementById('submit-error');
  const btn = document.getElementById('btn-submit');
  const text = document.getElementById('submit-text').value.trim();
  const question = document.getElementById('submit-question').value.trim();
  if (!text && !draftImages.length && !question) {
    err.textContent = '请至少填写文字、上传图片或填写疑问点';
    return;
  }
  const row = {
    student_id: currentUser.id,
    student_name: currentUser.name,
    text_content: text,
    image_data: draftImages.length ? JSON.stringify(draftImages) : null,
    question: question
  };
  btn.disabled = true; btn.textContent = '提交中…'; err.textContent = '';
  try {
    await supabaseInsert('submissions', row);
    resetDraft();
    await loadMyEntries(); renderHistory();
    toast('✓ 已提交');
  } catch(e) { err.textContent = '提交失败: ' + e.message; }
  finally { btn.disabled = false; btn.textContent = '提 交'; }
}

function renderHistory() {
  const el = document.getElementById('submit-history');
  if (!myEntries.length) { el.innerHTML = '<div class="no-score">暂无提交记录</div>'; return; }
  el.innerHTML = myEntries.map(renderRecordHTML).join('');
}

function renderRecordHTML(e, readonly) {
  const imgs = parseImages(e.image_data);
  let h = '<div class="entry-item">';
  if (e.text_content) h += '<div class="entry-text">' + esc(e.text_content) + '</div>';
  if (imgs.length) {
    h += '<div class="img-grid">' +
      imgs.map(src => '<img class="entry-img" src="' + src + '" loading="lazy" onclick="openLightbox(this.src)">').join('') +
      '</div>';
  }
  if (e.question) h += '<div class="q-box"><b>❓ 疑问点：</b>' + esc(e.question) + '</div>';
  if (e.created_at) {
    const d = new Date(e.created_at);
    if (!isNaN(d)) h += '<div class="entry-meta">提交于 ' + d.toLocaleString('zh-CN') + '</div>';
  }
  if (!readonly) {
    h += '<div class="entry-actions"><button class="btn btn-small btn-del" onclick="deleteEntry(' + e.id + ')">删除</button></div>';
  }
  h += '</div>';
  return h;
}

async function deleteEntry(id) {
  if (!confirm('确定删除这条提交吗？')) return;
  try {
    await supabaseDelete('submissions', id);
    await loadMyEntries(); renderHistory();
    toast('已删除');
  } catch(e) { alert('删除失败: ' + e.message); }
}

// ===== VIEW 3: ADMIN OVERVIEW =====
async function renderAdmin1() {
  const el = document.getElementById('admin1-content');
  let rows = [];
  try { rows = await supabaseGet('submissions?select=*'); }
  catch(e) { el.innerHTML = '<div class="loading">加载失败: ' + esc(e.message) + '</div>'; return; }

  const submittedIds = new Set(rows.map(r => r.student_id));
  const done = ROSTER.filter(r => submittedIds.has(r[1]));
  const pending = ROSTER.filter(r => !submittedIds.has(r[1]));

  let h = '<h2>📊 申报进度（' + done.length + '/' + ROSTER.length + '）</h2>';
  h += '<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:' + Math.round(done.length / ROSTER.length * 100) + '%"></div></div>';
  h += '<div class="progress-sub">共 ' + rows.length + ' 条申报记录</div>';
  h += '<h3>✅ 已完成（' + done.length + '）</h3><div class="tags">';
  if (done.length) h += done.map(r => '<span class="tag tag-done">' + esc(r[0]) + '</span>').join('');
  else h += '<span class="no-score">暂无</span>';
  h += '</div>';
  h += '<h3>⏳ 未完成（' + pending.length + '）</h3><div class="tags">';
  if (pending.length) h += pending.map(r => '<span class="tag tag-pending">' + esc(r[0]) + '</span>').join('');
  else h += '<span class="no-score">暂无</span>';
  h += '</div>';
  el.innerHTML = h;
}

// ===== VIEW 4: ADMIN DETAIL =====
async function renderAdmin2() {
  const sel = document.getElementById('admin2-select');
  const detail = document.getElementById('admin2-detail');
  detail.innerHTML = '';
  sel.innerHTML = '<option value="">请选择学生</option>' +
    ROSTER.map(r => '<option value="' + r[1] + '">' + esc(r[0]) + '（' + r[1] + '）</option>').join('');
  try { allRows = await supabaseGet('submissions?select=*&order=id.desc'); }
  catch(e) { detail.innerHTML = '<div class="loading">加载失败: ' + esc(e.message) + '</div>'; }
}
function renderStudentDetail(id) {
  const el = document.getElementById('admin2-detail');
  if (!id) { el.innerHTML = ''; return; }
  const rows = allRows.filter(r => r.student_id === id);
  if (!rows.length) { el.innerHTML = '<div class="no-score">该学生暂无申报</div>'; return; }
  const name = ROSTER.find(r => r[1] === id)[0];
  let h = '<h2>' + esc(name) + '（共 ' + rows.length + ' 条）</h2>';
  h += rows.map(r => renderRecordHTML(r, true)).join('');
  el.innerHTML = h;
}
</script>
</body>
</html>
