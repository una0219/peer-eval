* { margin: 0; padding: 0; box-sizing: border-box; }
body {

.container {

@keyframes fadeIn {

  to   { opacity: 1; transform: translateY(0); }
}
h1 { text-align: center; color: #333; margin-bottom: 8px; font-size: 28px; }
h2 { color: #555; font-size: 18px; margin: 24px 0 10px; padding-bottom: 6px; border-bottom: 2px solid #eee; }
h3 { color: #555; font-size: 15px; margin: 18px 0 8px; }
.subtitle { text-align: center; color: #888; margin-bottom: 28px; font-size: 14px; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #444; font-size: 14px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0;
  border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.2s; background: #fff;
  font-family: inherit;
}
.form-group textarea { resize: vertical; min-height: 72px; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #667eea; }
.btn {
  width: 100%; padding: 14px; border: none; border-radius: 8px;

}
.btn-primary {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; margin-top: 8px;
}
.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-secondary { background: #f0f0f0; color: #555; margin-top: 10px; }
.btn-secondary:hover { background: #e4e4e4; }
.btn-small { width: auto; padding: 6px 16px; font-size: 13px; margin-top: 4px; display: inline-block; }
.btn-del { background: #fdecea; color: #c0392b; }
.btn-del:hover { background: #fadbd8; }
.error-msg { color: #e74c3c; text-align: center; margin-top: 12px; font-size: 14px; min-height: 20px; }

  background: #f8f4ff; border-left: 4px solid #667eea;

.success-icon { text-align: center; font-size: 64px; margin-bottom: 16px; }
.success-text { text-align: center; font-size: 18px; color: #333; margin-bottom: 24px; }

  background: #fafafa; border: 1px solid #eee; border-radius: 12px;
  padding: 16px 20px; margin-bottom: 14px;
}
.module-title { font-weight: 700; color: #333; font-size: 16px; }
.module-sub { font-size: 12px; color: #999; margin: 4px 0 10px; line-height: 1.6; }
.btn-add { background: #f0edff; color: #667eea; }
.btn-add:hover { background: #e3dcff; }

.entry-score { color: #764ba2; font-weight: 700; font-size: 13px; }

.no-score { color: #ccc; font-style: italic; }
.loading { text-align: center; color: #999; padding: 40px; font-size: 15px; }

function compressImage(file, maxDim = 1200, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderSubmission() {
  const el = document.getElementById('submit-content');
  let h = '', lastGroup = '';
  MODULES.forEach(m => {
    if (m.group !== lastGroup) { h += '<h2>' + m.group + '</h2>'; lastGroup = m.group; }
    const entries = myEntries.filter(e => e.module_key === m.key);
    h += '<div class="module-card">';
    h += '<div class="module-title">' + m.title + '</div>';
    h += '<div class="module-sub">' + m.cats.map(esc).join(' · ') + '</div>';
    if (entries.length === 0) h += '<div class="no-score">暂无条目</div>';
    else entries.forEach(e => { h += renderEntryHTML(e, false); });
    h += '<button class="btn btn-small btn-add" onclick="openEditor(\'' + m.key + '\')">＋ 添加条目</button>';
    h += '</div>';
  });
  el.innerHTML = h;
}

  if (e.image_data) h += '<img class="entry-img" src="' + e.image_data + '" loading="lazy" onclick="openLightbox(this.src)">';

    h += '<div class="entry-actions">';
    h += '<button class="btn btn-small" onclick="editEntry(' + e.id + ')">编辑</button>';
    h += '<button class="btn btn-small btn-del" onclick="deleteEntry(' + e.id + ')">删除</button>';
    h += '</div>';
  }
  h += '</div>';
  return h;
}

// ---- Entry editor ----
function openEditor(moduleKey, entry) {
  edModule = moduleKey;
  edId = entry ? entry.id : null;
  edImage = entry && entry.image_data ? entry.image_data : '';
  const m = MODULES.find(x => x.key === moduleKey);
  document.getElementById('editor-title').textContent = (entry ? '编辑条目 — ' : '添加条目 — ') + m.title;
  const sel = document.getElementById('ed-cat');
  sel.innerHTML = m.cats.map(c => '<option>' + esc(c) + '</option>').join('');
  sel.value = entry && entry.category ? entry.category : m.cats[0];
  document.getElementById('ed-title').value = entry ? (entry.title || '') : '';
  document.getElementById('ed-score').value = entry ? (entry.score_claim || '') : '';
  document.getElementById('ed-text').value = entry ? (entry.text_content || '') : '';
  document.getElementById('ed-file').value = '';
  document.getElementById('ed-error').textContent = '';
  renderEdPreview();
  showModal('editor-modal');
}
function closeEditor() { hideModal('editor-modal'); edModule = null; edId = null; edImage = ''; }

function renderEdPreview() {
  const el = document.getElementById('ed-preview');
  if (!edImage) { el.innerHTML = ''; return; }
  el.innerHTML = '<img class="preview-img" src="' + edImage + '">' +
    '<button type="button" class="link-btn" onclick="removeEdImage()">移除图片</button>';
}
function removeEdImage() { edImage = ''; document.getElementById('ed-file').value = ''; renderEdPreview(); }

async function onFileChange(e) {
  const file = e.target.files[0];
  if (!file) return;
  try { edImage = await compressImage(file); renderEdPreview(); }
  catch(err) { document.getElementById('ed-error').textContent = '图片处理失败，请换一张试试'; }
}

async function saveEntry() {
  const err = document.getElementById('ed-error');
  const btn = document.getElementById('btn-save-entry');
  const cat = document.getElementById('ed-cat').value;
  const title = document.getElementById('ed-title').value.trim();
  const score = document.getElementById('ed-score').value.trim();
  const text = document.getElementById('ed-text').value.trim();
  if (!cat) { err.textContent = '请选择子类别'; return; }
  if (!title && !text && !edImage) { err.textContent = '请至少填写事由/描述、文字说明或上传图片'; return; }

  const row = {
    student_id: currentUser.id,
    student_name: currentUser.name,
    module_key: edModule,
    category: cat,
    title: title,
    score_claim: score,
    text_content: text,
    image_data: edImage || null
  };
  if (edId) row.id = edId;

  btn.disabled = true; btn.textContent = '保存中…'; err.textContent = '';
  try {
    if (edId) await supabaseUpsert('submissions', [row]);
    else await supabaseInsert('submissions', row);
    closeEditor();
    await loadMyEntries(); renderSubmission();
    toast('✓ 已保存');
  } catch(e) { err.textContent = '保存失败: ' + e.message; }
  finally { btn.disabled = false; btn.textContent = '保 存'; }
}

async function editEntry(id) {
  const e = myEntries.find(x => x.id === id);
  if (e) openEditor(e.module_key, e);
}
async function deleteEntry(id) {
  if (!confirm('确定删除这条申报吗？')) return;
  try {
    await supabaseDelete('submissions', id);
    await loadMyEntries(); renderSubmission();
    toast('已删除');
  } catch(e) { alert('删除失败: ' + e.message); }
}

// ===== VIEW 3: ADMIN OVERVIEW =====
async function renderAdmin1() {
  const el = document.getElementById('admin1-content');
  let rows = [];
  try { rows = await supabaseGet('submissions?select=*'); }
  catch(e) { el.innerHTML = '<div class="loading">加载失败: ' + esc(e.message) + '</div>'; return; }

  const submittedIds = new Set(rows.map(r => r.student_id));
  const done = ROSTER.filter(r => submittedIds.has(r[1]));
  const pending = ROSTER.filter(r => !submittedIds.has(r[1]));

  let h = '<h2>📊 申报进度（' + done.length + '/' + ROSTER.length + '）</h2>';
  h += '<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:' + Math.round(done.length / ROSTER.length * 100) + '%"></div></div>';
  h += '<div class="progress-sub">共 ' + rows.length + ' 条申报记录</div>';
  h += '<h3>✅ 已完成（' + done.length + '）</h3><div class="tags">';
  if (done.length) h += done.map(r => '<span class="tag tag-done">' + esc(r[0]) + '</span>').join('');
  else h += '<span class="no-score">暂无</span>';
  h += '</div>';
  h += '<h3>⏳ 未完成（' + pending.length + '）</h3><div class="tags">';
  if (pending.length) h += pending.map(r => '<span class="tag tag-pending">' + esc(r[0]) + '</span>').join('');
  else h += '<span class="no-score">暂无</span>';
  h += '</div>';
  el.innerHTML = h;
}

// ===== VIEW 4: ADMIN DETAIL =====
async function renderAdmin2() {
  const el = document.getElementById('admin2-content');
  const sel = document.getElementById('admin2-select');
  const detail = document.getElementById('admin2-detail');
  detail.innerHTML = '';
  sel.innerHTML = '<option value="">请选择学生</option>' +
    ROSTER.map(r => '<option value="' + r[1] + '">' + esc(r[0]) + '（' + r[1] + '）</option>').join('');
  el.innerHTML = '<div class="loading">加载中…</div>';
  try { allRows = await supabaseGet('submissions?select=*&order=id.asc'); }
  catch(e) { el.innerHTML = '<div class="loading">加载失败: ' + esc(e.message) + '</div>'; return; }
  el.innerHTML = '';
}
function renderStudentDetail(id) {
  const el = document.getElementById('admin2-detail');
  if (!id) { el.innerHTML = ''; return; }
  const rows = allRows.filter(r => r.student_id === id);
  if (!rows.length) { el.innerHTML = '<div class="no-score">该学生暂无申报</div>'; return; }
  const name = ROSTER.find(r => r[1] === id)[0];
  let h = '<h2>' + esc(name) + '（共 ' + rows.length + ' 条）</h2>';
  MODULES.forEach(m => {
    const es = rows.filter(r => r.module_key === m.key);
    if (!es.length) return;
    h += '<h3>' + m.title + '（' + es.length + ' 条）</h3>';
    es.forEach(e => { h += renderEntryHTML(e, true); });
  });
  el.innerHTML = h;
}
</script>
