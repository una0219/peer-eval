<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班委能力评测</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
}
.container {
  background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  width: 100%; max-width: 760px; padding: 36px 40px; animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
h1 { text-align: center; color: #333; margin-bottom: 8px; font-size: 28px; }
h2 { color: #555; font-size: 18px; margin: 24px 0 10px; padding-bottom: 6px; border-bottom: 2px solid #eee; }
h3 { color: #555; font-size: 15px; margin: 18px 0 8px; }
.subtitle { text-align: center; color: #888; margin-bottom: 28px; font-size: 14px; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #444; font-size: 14px; }
.form-group input {
  width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0;
  border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.2s; background: #fff;
}
.form-group input:focus { border-color: #667eea; }
.btn {
  width: 100%; padding: 14px; border: none; border-radius: 8px;
  font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.btn-primary {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; margin-top: 8px;
}
.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-secondary { background: #f0f0f0; color: #555; margin-top: 10px; }
.btn-secondary:hover { background: #e4e4e4; }
.btn-small { width: auto; padding: 8px 20px; font-size: 13px; margin-top: 4px; }
.error-msg { color: #e74c3c; text-align: center; margin-top: 12px; font-size: 14px; min-height: 20px; }
.current-user {
  background: #f8f4ff; border-left: 4px solid #667eea;
  padding: 12px 16px; border-radius: 0 8px 8px 0; margin-bottom: 24px; font-size: 15px; color: #555;
}
.rating-list { max-height: 460px; overflow-y: auto; padding-right: 4px; }
.rating-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
.rating-item:last-child { border-bottom: none; }
.rating-item .info { flex: 1; min-width: 0; }
.rating-item .name { font-weight: 600; color: #333; font-size: 15px; }
.rating-item .sid { color: #999; font-size: 12px; }
.rating-item input[type="number"] {
  width: 100px; padding: 8px 12px; border: 2px solid #e0e0e0;
  border-radius: 6px; font-size: 15px; text-align: center; outline: none; transition: border-color 0.2s;
}
.rating-item input[type="number"]:focus { border-color: #667eea; }
.rating-item input[type="number"]::-webkit-inner-spin-button,
.rating-item input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.rating-item input[type="number"] { -moz-appearance: textfield; }
.success-icon { text-align: center; font-size: 64px; margin-bottom: 16px; }
.success-text { text-align: center; font-size: 18px; color: #333; margin-bottom: 24px; }

/* Admin */
.progress-bar-wrap { background: #eee; border-radius: 8px; height: 18px; margin-bottom: 6px; overflow: hidden; }
.progress-bar-fill { height: 100%; border-radius: 8px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); transition: width 0.5s ease; }
.progress-sub { font-size: 13px; color: #888; text-align: center; margin-bottom: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.tag { display: inline-block; padding: 3px 9px; border-radius: 16px; font-size: 12px; font-weight: 500; }
.tag-done { background: #e8f5e9; color: #2e7d32; }
.tag-pending { background: #fff3e0; color: #e65100; }
.score-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 10px; }
.score-table th, .score-table td { padding: 8px 10px; text-align: center; border-bottom: 1px solid #eee; }
.score-table th { background: #f8f4ff; color: #555; font-weight: 700; }
.score-table td { color: #444; }
.score-table .highlight { font-weight: 700; color: #667eea; }
.person-card {
  background: #fafafa; border-radius: 12px; padding: 16px 20px;
  margin-bottom: 12px; border: 1px solid #eee; cursor: pointer;
  transition: all 0.2s; user-select: none;
}
.person-card:hover { border-color: #667eea; box-shadow: 0 2px 8px rgba(102,126,234,0.15); }
.person-card .card-header { display: flex; justify-content: space-between; align-items: center; }
.person-card .card-header h4 { font-size: 15px; color: #333; }
.person-card .card-score { font-size: 20px; font-weight: 700; color: #667eea; white-space: nowrap; margin-left: 12px; }
.person-card .card-detail {
  display: none; margin-top: 12px; padding-top: 12px;
  border-top: 1px solid #eee; font-size: 13px; color: #666; line-height: 1.8;
}
.person-card.open .card-detail { display: block; }
.person-card .card-arrow { font-size: 12px; color: #aaa; transition: transform 0.2s; }
.person-card.open .card-arrow { transform: rotate(180deg); }
.person-card .detail-avg { margin-top: 6px; font-weight: 700; color: #444; font-size: 14px; }
.no-score { color: #ccc; font-style: italic; }
.loading { text-align: center; color: #999; padding: 40px; font-size: 15px; }

.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }

.rating-list::-webkit-scrollbar { width: 6px; }
.rating-list::-webkit-scrollbar-track { background: transparent; }
.rating-list::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 3px; }
</style>
</head>
<body>

<div class="container" id="container">

  <!-- View 1: Login -->
  <div id="view-login">
    <h1>📋 班委能力评测</h1>
    <p class="subtitle">海技一班</p>
    <div class="form-group">
      <label for="login-name">姓名</label>
      <input type="text" id="login-name" list="name-list" placeholder="请输入姓名" autocomplete="off">
      <datalist id="name-list"></datalist>
    </div>
    <div class="form-group">
      <label for="login-id">学号</label>
      <input type="text" id="login-id" placeholder="请输入学号" autocomplete="off" inputmode="numeric">
    </div>
    <button class="btn btn-primary" onclick="handleLogin()">确 认</button>
    <p class="error-msg" id="login-error"></p>
  </div>

  <!-- View 2: Rating -->
  <div id="view-rating" style="display:none;">
    <h1>📝 班委能力评测</h1>
    <div class="current-user" id="current-user-info"></div>
    <div class="rating-list" id="rating-list"><div class="loading">加载中…</div></div>
    <button class="btn btn-primary" id="btn-submit" onclick="handleSubmit()">提交评分</button>
    <button class="btn btn-secondary" onclick="goToLogin()">返回登录</button>
    <p class="error-msg" id="rating-error"></p>
  </div>

  <!-- View 3: Complete -->
  <div id="view-complete" style="display:none;">
    <h1>✅ 评分完成</h1>
    <div class="success-icon">🎉</div>
    <p class="success-text">您的评分已成功提交！</p>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="goToRating()">重新评分</button>
      <button class="btn btn-secondary" onclick="goToLogin()">返回登录</button>
    </div>
  </div>

  <!-- View 4: Admin Page 1 — Overview -->
  <div id="view-admin1" style="display:none;">
    <h1>🔧 评测总览</h1>
    <p class="subtitle">互评 & 全评 进度与得分</p>
    <div id="admin1-content"><div class="loading">加载中…</div></div>
    <button class="btn btn-secondary" onclick="showView('view-admin2');renderAdmin2();">查看个人详情 →</button>
    <button class="btn btn-secondary" onclick="goToLogin()">返回登录</button>
  </div>

  <!-- View 5: Admin Page 2 — Per-person details -->
  <div id="view-admin2" style="display:none;">
    <h1>🔧 个人详情</h1>
    <p class="subtitle">点击卡片展开评分明细</p>
    <div id="admin2-content"><div class="loading">加载中…</div></div>
    <button class="btn btn-secondary" onclick="showView('view-admin1');renderAdmin1();">← 返回总览</button>
    <button class="btn btn-secondary" onclick="goToLogin()">返回登录</button>
  </div>

</div>

<script>
// ===== SUPABASE =====
const SUPABASE_URL = 'https://tcqwzumktgjyclnmotgb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjcXd6dW1rdGdqeWNsbm1vdGdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNDg1ODYsImV4cCI6MjEwMTkyNDU4Nn0.G0JcfU_W70q5HHUkYBzyKGH6i7tOFeEIYz9StZN1VoQ';

async function supabaseGet(path) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
  });
  if (!res.ok) throw new Error((await res.json()).message || res.statusText);
  return res.json();
}
async function supabaseUpsert(table, rows) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + table, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates'
    },
    body: JSON.stringify(rows)
  });
  if (!res.ok) throw new Error((await res.json()).message || res.statusText);
}

// ===== DATA =====
const PEOPLE = [
  { name: '程胜杰', id: '25020041012' },
  { name: '崔于悦', id: '25020041013' },
  { name: '高子昂', id: '25020041024' },
  { name: '海洋',   id: '25020041027' },
  { name: '何宗泉', id: '25020041032' },
  { name: '焦子健', id: '25020041036' },
  { name: '兰萍瑞', id: '25020041038' },
  { name: '楼庆同', id: '25020041060' },
  { name: '樊于悦', id: '25020041019' },
  { name: '官晓悠', id: '25020041026' },
  { name: '李馨悦', id: '25020041043' },
];

const RATERS = [
  '蔡丽华','曹哲','陈超祺','陈可可','陈瑞','陈晓曦','陈昀都','陈哲鸣',
  '单歆博','丁铎航','丁世杰','段熙然','段泽昊','高邓鑫','高颢瑜',
  '龚垚兴','韩雨辰','郝佳绮','何嘉怡','胡鑫慧','赖芳群','李宛佳泓',
  '李想','李雨航','练一凡','林依然','张永俊'
];

const ALL_NAMES = [...PEOPLE.map(p => p.name), ...RATERS].sort();
const PEOPLE_NAMES = new Set(PEOPLE.map(p => p.name));
const PEOPLE_IDS = new Set(PEOPLE.map(p => p.id));
const RATER_SET = new Set(RATERS);

// ID → Name lookup (for 11 PEOPLE)
const ID_TO_NAME = {};
PEOPLE.forEach(p => { ID_TO_NAME[p.id] = p.name; });

function raterLabel(r) {
  return r.rater_name || ID_TO_NAME[r.rater_id] || r.rater_id;
}

function classifyRow(r) {
  if (r.rater_name && PEOPLE_NAMES.has(r.rater_name)) return 'mutual';
  if (r.rater_name && RATER_SET.has(r.rater_name)) return 'full';
  if (r.rater_id && PEOPLE_IDS.has(r.rater_id)) return 'mutual';
  return 'unknown';
}

const ADMIN_NAME = '张思浩';
const ADMIN_ID = '000000';

let currentUser = null; // { name, id, mode }

// Init datalist
(function(){
  const dl = document.getElementById('name-list');
  ALL_NAMES.forEach(n => { const o = document.createElement('option'); o.value = n; dl.appendChild(o); });
})();

// ===== HELPERS =====
function showView(v) {
  ['view-login','view-rating','view-complete','view-admin1','view-admin2'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
  document.getElementById(v).style.display = 'block';
  document.getElementById('container').style.animation = 'none';
  document.getElementById('container').offsetHeight;
  document.getElementById('container').style.animation = 'fadeIn 0.3s ease';
}
function goToLogin() {
  currentUser = null;
  document.getElementById('login-name').value = '';
  document.getElementById('login-id').value = '';
  document.getElementById('login-error').textContent = '';
  showView('view-login');
}
function isValidSid(id) { return /^(25020041|24020041)\d{3}$/.test(id); }

// Get completed rater info from rows
function getCompletion(rows) {
  const doneIds = new Set();
  const idToName = {};
  rows.forEach(r => {
    doneIds.add(r.rater_id);
    idToName[r.rater_id] = r.rater_name || ID_TO_NAME[r.rater_id] || r.rater_id;
  });
  const isDone = name => {
    for (const [id, n] of Object.entries(idToName)) {
      if (n === name && doneIds.has(id)) return true;
    }
    // Also check: this name's known ID has scores
    const knownId = PEOPLE.find(p => p.name === name)?.id;
    if (knownId && doneIds.has(knownId)) return true;
    return false;
  };
  return { doneIds, idToName, isDone };
}

// ===== API =====
async function apiGetAllRows() { return supabaseGet('scores?select=*'); }
async function apiGetMyScores(raterId) {
  const rows = await supabaseGet('scores?rater_id=eq.' + encodeURIComponent(raterId) + '&select=*');
  const r = {}; rows.forEach(x => r[x.target_id] = x.score); return r;
}
async function apiSaveScores(raterId, raterName, scores) {
  const rows = Object.entries(scores).map(([tid, s]) => ({
    rater_id: raterId, rater_name: raterName, target_id: tid, score: s
  }));
  await supabaseUpsert('scores', rows);
}

// ===== VIEW 1: LOGIN =====
function handleLogin() {
  const name = document.getElementById('login-name').value.trim();
  const id = document.getElementById('login-id').value.trim();
  const err = document.getElementById('login-error');
  if (!name) { err.textContent = '请输入姓名'; return; }
  if (!id) { err.textContent = '请输入学号'; return; }

  if (name === ADMIN_NAME && id === ADMIN_ID) {
    err.textContent = ''; showView('view-admin1'); renderAdmin1(); return;
  }

  if (PEOPLE_NAMES.has(name)) {
    const p = PEOPLE.find(x => x.name === name);
    if (id !== p.id) { err.textContent = '学号与姓名不匹配'; return; }
    currentUser = { name, id, mode: 'mutual' };
    err.textContent = ''; showView('view-rating'); renderRating(); return;
  }

  if (RATER_SET.has(name)) {
    if (!isValidSid(id)) { err.textContent = '学号格式错误'; return; }
    currentUser = { name, id, mode: 'full' };
    err.textContent = ''; showView('view-rating'); renderRating(); return;
  }

  err.textContent = '姓名不在名单中';
}

// ===== VIEW 2: RATING =====
async function renderRating() {
  const modeLabel = currentUser.mode === 'mutual' ? '互评模式（排除自己）' : '全评模式';
  document.getElementById('current-user-info').textContent =
    '当前评分人：' + currentUser.name + '（' + currentUser.id + '）— ' + modeLabel;
  const targets = currentUser.mode === 'mutual' ? PEOPLE.filter(p => p.id !== currentUser.id) : PEOPLE;
  let existing = {};
  try { existing = await apiGetMyScores(currentUser.id); } catch(e) {}
  document.getElementById('rating-list').innerHTML = targets.map(p =>
    '<div class="rating-item"><div class="info"><div class="name">'+p.name+'</div><div class="sid">'+p.id+'</div></div>'+
    '<input type="number" id="score-'+p.id+'" min="0" max="100" step="1" value="'+(existing[p.id]!==undefined?existing[p.id]:'')+'" placeholder="0-100" inputmode="numeric"></div>'
  ).join('');
  document.getElementById('rating-error').textContent = '';
}
async function goToRating() { showView('view-rating'); await renderRating(); }

async function handleSubmit() {
  const targets = currentUser.mode === 'mutual' ? PEOPLE.filter(p => p.id !== currentUser.id) : PEOPLE;
  const err = document.getElementById('rating-error');
  const btn = document.getElementById('btn-submit');
  const newScores = {};
  for (const p of targets) {
    const input = document.getElementById('score-' + p.id);
    const val = input.value.trim();
    if (val === '') { err.textContent = '请为 ' + p.name + ' 打分'; input.focus(); return; }
    const n = Number(val);
    if (!Number.isInteger(n) || n < 0 || n > 100) { err.textContent = p.name + ' 的分数须为 0-100 的整数'; input.focus(); return; }
    newScores[p.id] = n;
  }
  btn.disabled = true; btn.textContent = '提交中…'; err.textContent = '';
  try { await apiSaveScores(currentUser.id, currentUser.name, newScores); showView('view-complete'); }
  catch(e) { err.textContent = '提交失败: ' + e.message; }
  finally { btn.disabled = false; btn.textContent = '提交评分'; }
}

// ===== VIEW 4: ADMIN PAGE 1 — Overview =====
async function renderAdmin1() {
  const el = document.getElementById('admin1-content');
  let rows = [];
  try { rows = await apiGetAllRows(); } catch(e) { el.innerHTML = '<div class="loading">加载失败: '+e.message+'</div>'; return; }

  const { isDone } = getCompletion(rows);

  // --- Progress ---
  const mutualDone = PEOPLE.filter(p => isDone(p.name));
  const mutualPending = PEOPLE.filter(p => !isDone(p.name));
  const fullDone = RATERS.filter(n => isDone(n));
  const fullPending = RATERS.filter(n => !isDone(n));

  let h = '';

  // === 互评进度 ===
  h += '<h2>🔄 互评进度（'+mutualDone.length+'/'+PEOPLE.length+'）</h2>';
  h += '<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:'+Math.round(mutualDone.length/PEOPLE.length*100)+'%"></div></div>';
  h += '<div class="progress-sub">';
  if (mutualDone.length) h += '已完成：'+mutualDone.map(p=>p.name).join('、');
  if (mutualPending.length) h += '；未完成：'+mutualPending.map(p=>p.name).join('、');
  h += '</div>';

  // === 全评进度 ===
  h += '<h2>📋 全评进度（'+fullDone.length+'/'+RATERS.length+'）</h2>';
  h += '<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:'+Math.round(fullDone.length/RATERS.length*100)+'%"></div></div>';
  h += '<div class="progress-sub">';
  if (fullDone.length) h += '已完成：'+fullDone.join('、');
  if (fullPending.length) h += '；未完成：'+fullPending.join('、');
  h += '</div>';

  // === 互评得分 ===
  h += '<h2>📊 互评得分</h2>';
  h += '<table class="score-table"><tr><th>姓名</th><th>评分人数</th><th>平均分</th></tr>';
  PEOPLE.forEach(p => {
    const scores = rows.filter(r => r.target_id === p.id && classifyRow(r) === 'mutual');
    const total = scores.reduce((s,r)=>s+r.score,0);
    const avg = scores.length ? (total/scores.length).toFixed(2) : '—';
    h += '<tr><td>'+p.name+'</td><td>'+scores.length+'人</td><td class="highlight">'+(scores.length?avg:'—')+'</td></tr>';
  });
  h += '</table>';

  // === 全评得分 ===
  h += '<h2>📊 全评得分</h2>';
  h += '<table class="score-table"><tr><th>姓名</th><th>评分人数</th><th>平均分</th></tr>';
  PEOPLE.forEach(p => {
    const scores = rows.filter(r => r.target_id === p.id && classifyRow(r) === 'full');
    const total = scores.reduce((s,r)=>s+r.score,0);
    const avg = scores.length ? (total/scores.length).toFixed(2) : '—';
    h += '<tr><td>'+p.name+'</td><td>'+scores.length+'人</td><td class="highlight">'+(scores.length?avg:'—')+'</td></tr>';
  });
  h += '</table>';

  el.innerHTML = h;
}

// ===== VIEW 5: ADMIN PAGE 2 — Per-person details =====
async function renderAdmin2() {
  const el = document.getElementById('admin2-content');
  let rows = [];
  try { rows = await apiGetAllRows(); } catch(e) { el.innerHTML = '<div class="loading">加载失败: '+e.message+'</div>'; return; }

  let h = '';
  PEOPLE.forEach(p => {
    const all = rows.filter(r => r.target_id === p.id);
    const mutual = all.filter(r => classifyRow(r) === 'mutual');
    const full = all.filter(r => classifyRow(r) === 'full');
    const total = all.reduce((s,r)=>s+r.score,0);
    const avg = all.length ? (total/all.length).toFixed(2) : null;

    h += '<div class="person-card" onclick="this.classList.toggle(\'open\')">';
    h += '<div class="card-header">';
    h += '<h4>'+p.name+' <span style="font-weight:400;color:#aaa;font-size:12px;">'+p.id+'</span></h4>';
    h += '<span class="card-score">'+ (all.length ? avg+' 分' : '—') +'</span>';
    h += '<span class="card-arrow">▼</span></div>';
    h += '<div class="card-detail">';
    if (!all.length) { h += '<div class="no-score">暂无评分</div>'; }
    else {
      h += '<div><b>互评：</b>';
      if (mutual.length) { mutual.forEach((r,i)=>{ h += raterLabel(r)+'：'+r.score+' 分'; if (i<mutual.length-1) h += '，'; }); }
      else h += '<span class="no-score">暂无</span>';
      h += '</div>';
      h += '<div style="margin-top:4px;"><b>全评：</b>';
      if (full.length) { full.forEach((r,i)=>{ h += raterLabel(r)+'：'+r.score+' 分'; if (i<full.length-1) h += '，'; }); }
      else h += '<span class="no-score">暂无</span>';
      h += '</div>';
      h += '<div class="detail-avg">平均分：'+avg+'（共 '+all.length+' 人评分，总分 '+total+'）</div>';
    }
    h += '</div></div>';
  });

  el.innerHTML = h;
}
</script>
</body>
</html>
