<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>互评系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  width: 100%;
  max-width: 720px;
  padding: 40px;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

h1 { text-align: center; color: #333; margin-bottom: 8px; font-size: 28px; }
.subtitle { text-align: center; color: #888; margin-bottom: 32px; font-size: 14px; }

.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #444; font-size: 14px; }
.form-group input,
.form-group select {
  width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0;
  border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.2s;
  background: #fff;
}
.form-group input:focus,
.form-group select:focus { border-color: #667eea; }

.btn {
  width: 100%; padding: 14px; border: none; border-radius: 8px;
  font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.btn-primary {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff; margin-top: 8px;
}
.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.btn-secondary { background: #f0f0f0; color: #555; margin-top: 12px; }
.btn-secondary:hover { background: #e4e4e4; }

.error-msg { color: #e74c3c; text-align: center; margin-top: 12px; font-size: 14px; min-height: 20px; }

.current-user {
  background: #f8f4ff; border-left: 4px solid #667eea;
  padding: 12px 16px; border-radius: 0 8px 8px 0; margin-bottom: 24px;
  font-size: 15px; color: #555;
}

.rating-list { max-height: 460px; overflow-y: auto; padding-right: 4px; }
.rating-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
.rating-item:last-child { border-bottom: none; }
.rating-item .info { flex: 1; min-width: 0; }
.rating-item .name { font-weight: 600; color: #333; font-size: 15px; }
.rating-item .sid { color: #999; font-size: 12px; }
.rating-item input[type="number"] {
  width: 100px; padding: 8px 12px; border: 2px solid #e0e0e0;
  border-radius: 6px; font-size: 15px; text-align: center; outline: none; transition: border-color 0.2s;
}
.rating-item input[type="number"]:focus { border-color: #667eea; }
.rating-item input[type="number"]::-webkit-inner-spin-button,
.rating-item input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.rating-item input[type="number"] { -moz-appearance: textfield; }

.success-icon { text-align: center; font-size: 64px; margin-bottom: 16px; }
.success-text { text-align: center; font-size: 18px; color: #333; margin-bottom: 24px; }

/* Admin styles */
.progress-bar-wrap {
  background: #eee; border-radius: 10px; height: 24px;
  margin-bottom: 8px; overflow: hidden;
}
.progress-bar-fill {
  height: 100%; border-radius: 10px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  transition: width 0.5s ease;
}
.progress-text {
  text-align: center; font-size: 18px; font-weight: 700; color: #667eea; margin-bottom: 20px;
}

.rater-lists { margin-bottom: 20px; }
.rater-section { margin-bottom: 10px; }
.rater-section summary {
  font-weight: 600; color: #555; cursor: pointer; padding: 8px 0;
  font-size: 14px; user-select: none;
}
.rater-section .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.rater-section .tag {
  display: inline-block; padding: 4px 10px; border-radius: 20px;
  font-size: 12px; font-weight: 500;
}
.tag-done { background: #e8f5e9; color: #2e7d32; }
.tag-pending { background: #fff3e0; color: #e65100; }

.person-card {
  background: #fafafa; border-radius: 12px; padding: 16px 20px;
  margin-bottom: 12px; border: 1px solid #eee; cursor: pointer;
  transition: all 0.2s; user-select: none;
}
.person-card:hover { border-color: #667eea; box-shadow: 0 2px 8px rgba(102,126,234,0.15); }
.person-card .card-header {
  display: flex; justify-content: space-between; align-items: center;
}
.person-card .card-header h3 { font-size: 15px; color: #333; }
.person-card .card-score {
  font-size: 20px; font-weight: 700; color: #667eea;
  white-space: nowrap; margin-left: 12px;
}
.person-card .card-detail {
  display: none; margin-top: 12px; padding-top: 12px;
  border-top: 1px solid #eee; font-size: 13px; color: #666; line-height: 1.8;
}
.person-card.open .card-detail { display: block; }
.person-card .card-arrow { font-size: 12px; color: #aaa; transition: transform 0.2s; }
.person-card.open .card-arrow { transform: rotate(180deg); }
.person-card .detail-avg {
  margin-top: 6px; font-weight: 700; color: #444; font-size: 14px;
}

.no-score { color: #ccc; font-style: italic; }

.loading { text-align: center; color: #999; padding: 40px; font-size: 15px; }

.rating-list::-webkit-scrollbar { width: 6px; }
.rating-list::-webkit-scrollbar-track { background: transparent; }
.rating-list::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 3px; }

.hint { font-size: 12px; color: #aaa; margin-top: 4px; }
</style>
</head>
<body>

<div class="container" id="container">
  <!-- View 1: Login -->
  <div id="view-login">
    <h1>📋 互评系统</h1>
    <p class="subtitle">海技一班 · 班内互评</p>
    <div class="form-group">
      <label for="login-name">姓名</label>
      <select id="login-name">
        <option value="">请选择您的姓名</option>
      </select>
    </div>
    <div class="form-group">
      <label for="login-id">学号</label>
      <input type="text" id="login-id" placeholder="请输入11位学号" autocomplete="off" inputmode="numeric" maxlength="11">
      <div class="hint">25020041XXX 或 24020041XXX</div>
    </div>
    <button class="btn btn-primary" id="btn-login" onclick="handleLogin()">确 认</button>
    <p class="error-msg" id="login-error"></p>
  </div>

  <!-- View 2: Rating -->
  <div id="view-rating" style="display:none;">
    <h1>📝 互评打分</h1>
    <div class="current-user" id="current-user-info"></div>
    <div class="rating-list" id="rating-list"><div class="loading">加载中…</div></div>
    <button class="btn btn-primary" id="btn-submit" onclick="handleSubmit()">提交评分</button>
    <button class="btn btn-secondary" onclick="goToLogin()">返回登录</button>
    <p class="error-msg" id="rating-error"></p>
  </div>

  <!-- View 3: Complete -->
  <div id="view-complete" style="display:none;">
    <h1>✅ 评分完成</h1>
    <div class="success-icon">🎉</div>
    <p class="success-text">您的评分已成功提交！</p>
    <button class="btn btn-primary" onclick="goToRating()">重新评分</button>
    <button class="btn btn-secondary" onclick="goToLogin()">返回登录</button>
  </div>

  <!-- View 4: Admin -->
  <div id="view-admin" style="display:none;">
    <h1>🔧 管理员面板</h1>
    <p class="subtitle">班内互评进度与结果</p>
    <div id="admin-content"><div class="loading">加载中…</div></div>
    <button class="btn btn-secondary" onclick="goToLogin()">返回登录</button>
  </div>
</div>

<script>
// ===== SUPABASE CONFIG =====
const SUPABASE_URL = 'https://tcqwzumktgjyclnmotgb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjcXd6dW1rdGdqeWNsbm1vdGdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNDg1ODYsImV4cCI6MjEwMTkyNDU4Nn0.G0JcfU_W70q5HHUkYBzyKGH6i7tOFeEIYz9StZN1VoQ';

async function supabaseGet(path) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
  });
  if (!res.ok) throw new Error((await res.json()).message || res.statusText);
  return res.json();
}

async function supabaseUpsert(table, rows) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + table, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates'
    },
    body: JSON.stringify(rows)
  });
  if (!res.ok) throw new Error((await res.json()).message || res.statusText);
}

// ===== DATA =====
// 被评人（11人）
const PEOPLE = [
  { name: '程胜杰', id: '25020041012' },
  { name: '崔于悦', id: '25020041013' },
  { name: '高子昂', id: '25020041024' },
  { name: '海洋',   id: '25020041027' },
  { name: '何宗泉', id: '25020041032' },
  { name: '焦子健', id: '25020041036' },
  { name: '兰萍瑞', id: '25020041038' },
  { name: '楼庆同', id: '25020041060' },
  { name: '樊于悦', id: '25020041019' },
  { name: '官晓悠', id: '25020041026' },
  { name: '李馨悦', id: '25020041043' },
];

// 评分人（27人 — 38人名单去除上述11人）
const RATERS = [
  '蔡丽华','曹哲','陈超祺','陈可可','陈瑞','陈晓曦','陈昀都','陈哲鸣',
  '单歆博','丁铎航','丁世杰','段熙然','段泽昊','高邓鑫','高颢瑜',
  '龚垚兴','韩雨辰','郝佳绮','何嘉怡','胡鑫慧','赖芳群','李宛佳泓',
  '李想','李雨航','练一凡','林依然','张永俊'
];

const ADMIN_NAME = '张思浩';
const ADMIN_ID = '000000';

let currentUser = null; // { name, id }

// Populate login dropdown
(function initDropdown() {
  const sel = document.getElementById('login-name');
  RATERS.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    sel.appendChild(opt);
  });
})();

// ===== HELPERS =====
function showView(viewId) {
  ['view-login','view-rating','view-complete','view-admin'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
  document.getElementById(viewId).style.display = 'block';
  document.getElementById('container').style.animation = 'none';
  document.getElementById('container').offsetHeight;
  document.getElementById('container').style.animation = 'fadeIn 0.3s ease';
}

function goToLogin() {
  currentUser = null;
  document.getElementById('login-name').value = '';
  document.getElementById('login-id').value = '';
  document.getElementById('login-error').textContent = '';
  showView('view-login');
}

function isValidStudentId(id) {
  return /^(25020041|24020041)\d{3}$/.test(id);
}

// ===== API =====
async function apiGetAllRows() {
  return await supabaseGet('scores?select=*');
}

async function apiGetMyScores(raterId) {
  const rows = await supabaseGet('scores?rater_id=eq.' + encodeURIComponent(raterId) + '&select=*');
  const result = {};
  for (const row of rows) result[row.target_id] = row.score;
  return result;
}

async function apiSaveScores(raterId, raterName, scores) {
  const rows = Object.entries(scores).map(([target_id, score]) => ({
    rater_id: raterId,
    rater_name: raterName,
    target_id: target_id,
    score: score
  }));
  await supabaseUpsert('scores', rows);
  return { ok: true };
}

// ===== VIEW 1: LOGIN =====
function handleLogin() {
  const nameEl = document.getElementById('login-name');
  const name = nameEl.value.trim();
  const id = document.getElementById('login-id').value.trim();
  const errEl = document.getElementById('login-error');

  if (!name) { errEl.textContent = '请选择您的姓名'; return; }
  if (!id) { errEl.textContent = '请输入学号'; return; }

  // Admin
  if (name === ADMIN_NAME && id === ADMIN_ID) {
    errEl.textContent = '';
    showView('view-admin');
    renderAdmin();
    return;
  }

  // Validate rater
  if (!RATERS.includes(name)) {
    errEl.textContent = '姓名不在评分人名单中'; return;
  }
  if (!isValidStudentId(id)) {
    errEl.textContent = '学号格式错误，应为11位数字，以25020041或24020041开头'; return;
  }

  currentUser = { name: name, id: id };
  errEl.textContent = '';
  showView('view-rating');
  renderRating();
}

// ===== VIEW 2: RATING =====
async function renderRating() {
  document.getElementById('current-user-info').textContent =
    `当前评分人：${currentUser.name}（${currentUser.id}）`;

  let existingScores = {};
  try { existingScores = await apiGetMyScores(currentUser.id); } catch (e) {}

  const listEl = document.getElementById('rating-list');
  listEl.innerHTML = PEOPLE.map(p => `
    <div class="rating-item">
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="sid">${p.id}</div>
      </div>
      <input type="number" id="score-${p.id}" min="0" max="100" step="1"
             value="${existingScores[p.id] !== undefined ? existingScores[p.id] : ''}"
             placeholder="0-100" inputmode="numeric">
    </div>
  `).join('');
  document.getElementById('rating-error').textContent = '';
}

async function goToRating() {
  showView('view-rating');
  await renderRating();
}

async function handleSubmit() {
  const errEl = document.getElementById('rating-error');
  const btn = document.getElementById('btn-submit');
  const newScores = {};

  for (const p of PEOPLE) {
    const input = document.getElementById('score-' + p.id);
    const val = input.value.trim();
    if (val === '') { errEl.textContent = `请为 ${p.name} 打分`; input.focus(); return; }
    const num = Number(val);
    if (!Number.isInteger(num) || num < 0 || num > 100) {
      errEl.textContent = `${p.name} 的分数须为 0-100 的整数`; input.focus(); return;
    }
    newScores[p.id] = num;
  }

  btn.disabled = true;
  btn.textContent = '提交中…';
  errEl.textContent = '';

  try {
    await apiSaveScores(currentUser.id, currentUser.name, newScores);
    showView('view-complete');
  } catch (e) {
    errEl.textContent = '提交失败: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '提交评分';
  }
}

// ===== VIEW 4: ADMIN =====
async function renderAdmin() {
  const adminEl = document.getElementById('admin-content');

  let allRows = [];
  try { allRows = await apiGetAllRows(); } catch (e) {
    adminEl.innerHTML = '<div class="loading">加载失败: ' + e.message + '</div>';
    return;
  }

  // --- Who has completed? ---
  const doneIds = new Set(allRows.map(r => r.rater_id));
  // Map rater_id → rater_name (from scores)
  const idToName = {};
  allRows.forEach(r => { if (r.rater_name) idToName[r.rater_id] = r.rater_name; });

  // For completed: we know idToName
  const doneNames = [];
  const pendingNames = [];
  RATERS.forEach(name => {
    // Check if any rater with this name has submitted
    const found = Object.entries(idToName).some(([id, n]) => n === name && doneIds.has(id));
    if (found) doneNames.push(name);
    else pendingNames.push(name);
  });

  const doneCount = doneNames.length;
  const total = RATERS.length;
  const pct = Math.round((doneCount / total) * 100);

  // --- Build HTML ---
  let html = '';

  // Progress
  html += `<div class="progress-text">${doneCount} / ${total} 人已完成（${pct}%）</div>`;
  html += `<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>`;

  // Completed & pending lists
  html += `<div class="rater-lists">`;
  html += `<details class="rater-section"><summary>✅ 已完成（${doneCount}人）</summary><div class="tags">`;
  doneNames.forEach(n => html += `<span class="tag tag-done">${n}</span>`);
  if (doneCount === 0) html += '<span style="color:#ccc;font-size:12px;">暂无</span>';
  html += `</div></details>`;

  html += `<details class="rater-section" open><summary>⏳ 未完成（${pendingNames.length}人）</summary><div class="tags">`;
  pendingNames.forEach(n => html += `<span class="tag tag-pending">${n}</span>`);
  if (pendingNames.length === 0) html += '<span style="color:#2e7d32;font-size:12px;">全部完成 🎉</span>';
  html += `</div></details>`;
  html += `</div>`;

  // Per-person cards
  html += `<h3 style="margin: 20px 0 12px; color:#555;">被评人得分</h3>`;

  PEOPLE.forEach((person, idx) => {
    // Gather scores for this person
    const received = [];
    allRows.forEach(row => {
      if (row.target_id === person.id) {
        received.push({ raterName: row.rater_name || row.rater_id, score: row.score });
      }
    });

    const totalScore = received.reduce((s, r) => s + r.score, 0);
    const avgScore = received.length > 0 ? (totalScore / received.length).toFixed(2) : null;

    html += `<div class="person-card" onclick="this.classList.toggle('open')">`;
    html += `<div class="card-header">`;
    html += `<h3>${person.name} <span style="font-weight:400;color:#999;font-size:12px;">${person.id}</span></h3>`;
    html += `<span class="card-score">${received.length > 0 ? totalScore + ' 分' : '—'}</span>`;
    html += `<span class="card-arrow">▼</span>`;
    html += `</div>`;

    html += `<div class="card-detail">`;
    if (received.length === 0) {
      html += `<div class="no-score">暂无评分</div>`;
    } else {
      html += `<div>`;
      received.forEach((r, i) => {
        html += `${r.raterName}：${r.score} 分`;
        if (i < received.length - 1) html += '，';
      });
      html += `</div>`;
      html += `<div class="detail-avg">平均分：${avgScore}（共 ${received.length} 人评分）</div>`;
    }
    html += `</div>`;
    html += `</div>`;
  });

  adminEl.innerHTML = html;
}
</script>
</body>
</html>
